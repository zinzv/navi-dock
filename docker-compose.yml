name: navi-dock

services:
  navi-dock:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${APP_VERSION:-}
    image: navi-dock:latest
    container_name: navi-dock
    ports:
      - "${SERVER_PORT:-7530}:7530"
    env_file:
      - .env
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      APP_VERSION: ${APP_VERSION:-}
      # 访问模式（右上角图标：自动 / 内网 / 外网）：
      # - 自动：浏览器探测 https?://<LAN_PROBE_DOMAIN>/api/network/ping
      #   可达则优先用各应用内网地址，否则用外网地址；模式本身保持「自动」
      # - 内网 / 外网：强制使用对应地址（缺失时回退到另一个）
      # 只填域名（如 lan.zeven.site）；路径固定为 /api/network/ping，协议跟随当前页面
      # 自动模式必填；修改后需重建容器生效
      LAN_PROBE_DOMAIN: ${LAN_PROBE_DOMAIN:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
